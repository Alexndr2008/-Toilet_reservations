<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход / Регистрация</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <!-- Переключатель -->
        <div class="flex mb-8 border-b">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-2 border-b-2 border-indigo-600 font-bold">Вход</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-2 border-b-2 border-transparent text-gray-400">Регистрация</button>
        </div>

        <!-- Форма Входа -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Имя пользователя</label>
                <input type="text" name="username" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Пароль</label>
                <input type="password" name="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Войти</button>
        </form>

        <!-- Форма Регистрации (скрыта по умолчанию) -->
        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700">Имя пользователя</label>
                <input type="text" name="username" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Пароль</label>
                <input type="password" name="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">Создать аккаунт</button>
        </form>

        <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <script>
        const API_URL = 'http://127.0.0'; // Твой адрес Django

        function switchTab(type) {
            const isLogin = type === 'login';
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('register-form').classList.toggle('hidden', isLogin);
            
            document.getElementById('tab-login').className = isLogin ? 'flex-1 pb-2 border-b-2 border-indigo-600 font-bold' : 'flex-1 pb-2 border-b-2 border-transparent text-gray-400';
            document.getElementById('tab-register').className = !isLogin ? 'flex-1 pb-2 border-b-2 border-green-600 font-bold text-green-600' : 'flex-1 pb-2 border-b-2 border-transparent text-gray-400';
        }

        // Логика Login
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const resp = await fetch(`${API_URL}/login/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await resp.json();
                
                if (resp.ok) {
                    localStorage.setItem('token', result.access); // Сохраняем JWT
                    document.getElementById('message').innerText = "Успешный вход! Перенаправление...";
                    document.getElementById('message').className = "mt-4 text-center text-green-600";
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    throw new Error(result.detail || 'Ошибка входа');
                }
            } catch (err) {
                document.getElementById('message').innerText = err.message;
                document.getElementById('message').className = "mt-4 text-center text-red-600";
            }
        };

        // Логика Register
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const resp = await fetch(`${API_URL}/register/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                if (resp.ok) {
                    alert("Регистрация успешна! Теперь войдите.");
                    switchTab('login');
                } else {
                    const errorData = await resp.json();
                    alert("Ошибка: " + JSON.stringify(errorData));
                }
            } catch (err) {
                console.error(err);
            }
        };
    </script>
</body>
</html>
