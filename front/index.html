<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC Booking System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Tailwind для быстрой верстки отступов, но основной дизайн в style.css -->
    <script src="./script.js" defer></script>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar">
        <div class="container mx-auto flex justify-between items-center px-4">
            <h1 class="logo">WC<span>Reserved</span></h1>
            <div id="auth-controls">
                <button onclick="location.href='auth.html'" class="btn-outline">Войти</button>
            </div>
            <div id="user-controls" class="hidden">
                <span id="username-box" class="mr-4 font-medium"></span>
                <button onclick="logout()" class="text-red-500 underline">Выйти</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">

        <!-- Панель фильтров -->
        <section class="filters-panel">
            <div class="filter-group">
                <label>Класс комфорта</label>
                <select id="filter-level">
                    <option value="all">Все варианты</option>
                    <option value="Эконом">Эконом</option>
                    <option value="Комфорт">Комфорт</option>
                    <option value="Бизнес">Бизнес</option>
                    <option value="Первый класс">Первый класс</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Показать свободные на:</label>
                <input type="datetime-local" id="filter-date">
            </div>
            <button onclick="applyFilters()" class="btn-primary">Применить</button>
        </section>

        <!-- Сетка карточек -->
        <div id="toilet-list" class="grid-container">
            <!-- Сюда JS отрисует данные -->
            <div class="loader">Загрузка данных...</div>
        </div>
    </main>

    <!-- Модальное окно бронирования -->
    <div id="booking-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Бронирование комнаты</h3>
            <form id="booking-form">
                <input type="hidden" id="selected-toilet-id">
                <label class="block mb-2 text-sm text-gray-600">Вместимость комнаты (чел.)</label>
                <input type="number" id="room-capacity" min="1" required class="input-field">
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="btn-text">Отмена</button>
                    <button type="submit" class="btn-primary">Подтвердить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
